name: windows-installer
# Builds USCL-Setup.exe: RPCS3 + uscl-rpcs3 patches (MSVC, RPCS3's own CI steps), uscl-rpcn, uscl-dw, uscl-bridge.
# Manual or on a v* tag only: a full RPCS3 build takes about an hour of runner time.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

permissions:
  contents: write   # the draft release; nothing else

jobs:
  installer:
    runs-on: windows-2025-vs2026
    env:
      # from RPCS3's .github/workflows/rpcs3.yml at the commit our patches are made against
      RPCS3_COMMIT: 'e53ac18'
      RPCN_COMMIT: '7a3c3c4'
      DW_COMMIT: '39391e7'  # quoted: unquoted YAML reads 39391e7 as a number
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.12.0'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202609280346'
      LLVM_VER: '22.1.8'
      VULKAN_VER: '1.4.341.1'
      VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
      CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
      CCACHE_BIN_DIR: 'C:\ccache_bin'
      CCACHE_DIR: 'C:\ccache'
      DEPS_CACHE_DIR: ./dependency_cache
      BUILD_REPOSITORY_NAME: ${{ github.repository }}
      BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
      BUILD_SOURCEVERSION: ${{ github.sha }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/
    steps:
      - uses: actions/checkout@v4
        with:
          path: uscl

      - name: Get RPCS3, RPCN and Demonware sources with our patches
        run: |
          git config --global user.name uscl-ci && git config --global user.email ci@uscl.invalid
          git clone -q https://github.com/RPCS3/rpcs3.git rpcs3
          git -C rpcs3 checkout -q $RPCS3_COMMIT && git -C rpcs3 am -q "$PWD"/uscl/uscl-rpcs3/patches/*.patch
          git clone -q https://github.com/RipleyTom/rpcn.git rpcn
          git -C rpcn checkout -q $RPCN_COMMIT && git -C rpcn am -q "$PWD"/uscl/uscl-rpcn/patches/*.patch
          git clone -q https://github.com/Laupetin/open-bitdemon-emulator obde
          git -C obde checkout -q $DW_COMMIT && git -C obde am -q "$PWD"/uscl/uscl-dw/patches/*.patch

      # Built RPCS3 and servers are kept as assets of a draft release (ci-cache), named by a hash of what they're
      # built from: a release that only changes the home screen skips the hour of compiling. (Actions caches
      # don't carry over from one tag's run to the next.)
      - name: Reuse RPCS3 and the servers if their sources haven't changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$GITHUB_REPOSITORY
          rk=rpcs3-$RPCS3_COMMIT-$(cat uscl/uscl-rpcs3/patches/*.patch | sha256sum | cut -c1-16)
          sk=servers-$RPCN_COMMIT-$DW_COMMIT-$( { cat uscl/uscl-rpcn/patches/*.patch uscl/uscl-dw/patches/*.patch; git -C uscl ls-tree -r HEAD uscl-bridge; } | sha256sum | cut -c1-16)
          echo "RPCS3_KEY=$rk" >> $GITHUB_ENV; echo "SERVERS_KEY=$sk" >> $GITHUB_ENV
          if gh release download ci-cache -R $R -p "$rk.zip" -D cache 2>/dev/null; then
            7z x -y -orpcs3/bin "cache/$rk.zip" >/dev/null && echo "RPCS3_CACHED=1" >> $GITHUB_ENV && echo "reusing $rk"
          fi
          if gh release download ci-cache -R $R -p "$sk.zip" -D cache 2>/dev/null; then
            7z x -y -oservers "cache/$sk.zip" >/dev/null && echo "SERVERS_CACHED=1" >> $GITHUB_ENV && echo "reusing $sk"
          fi

      - uses: nuget/setup-nuget@v2
        if: env.RPCS3_CACHED != '1'
      - name: Restore NuGet packages
        if: env.RPCS3_CACHED != '1'
        working-directory: rpcs3
        run: nuget restore rpcs3.sln

      - name: Setup env
        shell: pwsh
        run: |
          echo "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" >> ${{ github.env }}
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}" >> ${{ github.env }}

      - name: Download and unpack dependencies (RPCS3's scripts)
        working-directory: rpcs3
        run: |
          .ci/get_keys-windows.sh
          .ci/setup-windows.sh
          .ci/setup-windows-ci-vars.sh win64 msvc
          grep -v '^#' .ci/ci-vars.env | grep = >> "$GITHUB_ENV"

      - uses: microsoft/setup-msbuild@v2
        if: env.RPCS3_CACHED != '1'

      - name: Compile USCL (RPCS3)
        if: env.RPCS3_CACHED != '1'
        working-directory: rpcs3
        shell: pwsh
        run: msbuild rpcs3.sln /p:Configuration=Release /v:minimal /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:UseMultiToolTask=true /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\rpcs3\buildfiles\msvc\ci_only.targets"

      - name: Install protoc
        if: env.SERVERS_CACHED != '1'
        run: choco install -y --no-progress protoc

      - name: Compile servers
        if: env.SERVERS_CACHED != '1'
        # pwsh, so the vendored OpenSSL build finds Strawberry Perl and not Git's
        shell: pwsh
        run: |
          cd uscl/uscl-bridge; cargo build --release; cd ../..
          cd rpcn; cargo build --release; cd ..
          cd obde; cargo build --release -p dw-server; cd ..

      - name: Collect the servers
        if: env.SERVERS_CACHED != '1'
        run: |
          mkdir -p servers
          cp uscl/uscl-bridge/target/release/uscl-bridge.exe obde/target/release/dw-server.exe servers/
          cp rpcn/target/release/rpcn.exe servers/uscl-rpcn.exe
          cp "$(find uscl/uscl-bridge/target/release/build -name steam_api64.dll | head -1)" servers/

      # Party chat: Discord's Social SDK can't be downloaded without a Discord login, so a copy is kept on the
      # ci-cache draft release (not public). Without it the home screen builds without party chat.
      - name: Get the Discord Social SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download ci-cache -R $GITHUB_REPOSITORY -p "discord-social-sdk-*.zip" -D dsdk 2>/dev/null; then
            7z x -y -odsdk dsdk/*.zip >/dev/null && echo "DISCORD_SDK=$(cygpath -w "$PWD/dsdk/discord_social_sdk")" >> $GITHUB_ENV
          fi

      - name: Compile home screen (uscl-shell)
        shell: pwsh
        run: |
          # SDL3 to match RPCS3's (3rdparty/libsdl-org/SDL)
          curl.exe -fsSLo sdl3.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
          Expand-Archive sdl3.zip -DestinationPath sdl3
          $sdl = (Get-ChildItem sdl3 -Directory | Select-Object -First 1).FullName
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ("${{ github.ref_type }}" -ne "tag") { $version = "0.0.0-dev" }
          cmake -S uscl/uscl-shell -B shell-build -A x64 "-DCMAKE_PREFIX_PATH=$env:QTDIR" "-DSDL3_DIR=$sdl/cmake" "-DUSCL_VERSION=$version" "-DUSCL_DISCORD_SDK=$env:DISCORD_SDK"
          cmake --build shell-build --config Release
          Copy-Item "$sdl/lib/x64/SDL3.dll" shell-build/Release/
          # a GUI-subsystem exe: wait for it explicitly; Qt's DLLs aren't deployed next to it yet
          $env:PATH = "$env:QTDIR\bin;$env:PATH"
          $t = Start-Process shell-build/Release/uscl.exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($t.ExitCode -ne 0) { Write-Error "uscl self-test failed"; exit 1 }

      - name: Stage files
        run: |
          S=stage; B=rpcs3/bin
          rm -f $B/rpcs3.exp $B/rpcs3.lib $B/rpcs3.pdb
          cp -r $B $S
          mkdir -p $S/config/input_configs
          curl -fsSL https://raw.githubusercontent.com/gabomdq/SDL_GameControllerDB/master/gamecontrollerdb.txt > $S/config/input_configs/gamecontrollerdb.txt
          curl -fsSL 'https://rpcs3.net/compatibility?api=v1&export' | iconv -t UTF-8 > $S/GuiConfigs/compat_database.dat || true
          cp servers/* $S/
          cp uscl/uscl-rpcs3/uscl_patches.yml $S/   # RPCS3 loads its generated built-in patches from its own folder
          cp shell-build/Release/uscl.exe shell-build/Release/SDL3.dll $S/
          [ -f shell-build/Release/discord_partner_sdk.dll ] && cp shell-build/Release/discord_partner_sdk.dll $S/
          "$QTDIR/bin/windeployqt.exe" --release --no-translations --qmldir uscl/uscl-shell/qml $S/uscl.exe
          # same data templates as packaging/build-linux.sh; the USCL panel looks for them in uscl-data
          D=$S/uscl-data; mkdir -p $D/rpcn $D/dw/storage/publisher/18396 $D/dw/storage/publisher/5280
          cp rpcn/{servers,server_redirs,scoreboards}.cfg $D/rpcn/
          sed -e 's/^Port=.*/Port=31413/' -e 's/^Host=.*/Host=127.0.0.1/' -e 's/^HostIPv6=.*/HostIPv6=::ffff:127.0.0.1/' -e 's/^StatServerHost=.*/StatServerHost=127.0.0.1/' rpcn/rpcn.cfg > $D/rpcn/rpcn.cfg
          python uscl/uscl-dw/bo2-wad/mkwad.py $D/dw/storage/publisher/18396/online_tu19_mp_english.wad \
            uscl/uscl-dw/bo2-wad/leagues.info uscl/uscl-dw/bo2-wad/playlists_mp.info
          cp uscl/uscl-dw/mw2-files/{playlists.patch3,motd-english.txt,messageoftheday.info} $D/dw/storage/publisher/5280/
          ls $S

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install -y --no-progress innosetup }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & $iscc /DStage="${{ github.workspace }}\stage" /DVersion="$version" /O"${{ github.workspace }}\artifacts" uscl\packaging\windows\uscl.iss
          # the updater checks this
          (Get-FileHash artifacts\USCL-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  USCL-Setup.exe" | Out-File -Encoding ascii -NoNewline artifacts\USCL-Setup.exe.sha256

      # Keep what was compiled for the next release (see "Reuse RPCS3 ...")
      - name: Save RPCS3 and the servers for later releases
        if: env.RPCS3_CACHED != '1' || env.SERVERS_CACHED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd uscl
          gh release view ci-cache >/dev/null 2>&1 || gh release create ci-cache --draft --title "CI cache" --notes "Build cache for the Windows installer (not a release)"
          cd ..
          if [ "$RPCS3_CACHED" != 1 ]; then (cd rpcs3/bin && 7z a -tzip "../../$RPCS3_KEY.zip" . >/dev/null); gh release upload ci-cache -R $GITHUB_REPOSITORY "$RPCS3_KEY.zip" --clobber; fi
          if [ "$SERVERS_CACHED" != 1 ]; then (cd servers && 7z a -tzip "../$SERVERS_KEY.zip" . >/dev/null); gh release upload ci-cache -R $GITHUB_REPOSITORY "$SERVERS_KEY.zip" --clobber; fi
          # only the current pair is worth keeping
          for old in $(gh release view ci-cache -R $GITHUB_REPOSITORY --json assets -q '.assets[].name'); do
            case "$old" in discord-social-sdk-*) continue;; esac  # the Discord SDK lives here too
            [ "$old" = "$RPCS3_KEY.zip" ] || [ "$old" = "$SERVERS_KEY.zip" ] || gh release delete-asset ci-cache "$old" -R $GITHUB_REPOSITORY -y
          done

      - uses: actions/upload-artifact@v4
        with:
          name: USCL-Setup
          path: artifacts/USCL-Setup.exe*
          if-no-files-found: error

      # A draft release: USCL ignores it until packaging/sign-release.sh (run on the maintainer's PC, where
      # the update signing key lives) has checked and signed it and published it.
      - name: Upload draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd uscl
          pre=""; case "${{ github.ref_name }}" in *-*) pre="--prerelease";; esac
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --draft $pre --title "USCL ${{ github.ref_name }}" --notes "USCL ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" ../artifacts/USCL-Setup.exe ../artifacts/USCL-Setup.exe.sha256 --clobber
